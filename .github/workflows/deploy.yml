# 推送到 main 时构建并部署到 Cloudflare Workers。
# 需要在仓库 Settings → Secrets and variables → Actions 里配置：
#   CLOUDFLARE_API_TOKEN  （用 Cloudflare 的 “Edit Cloudflare Workers” 模板创建）
# wrangler.jsonc 里的 account_id 也要改成你自己的 Account ID。

name: Build & Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type check & lint
        run: |
          npx tsc --noEmit
          npx eslint src worker

      - name: Build static site
        run: |
          npx next build
          node scripts/media-sizes.mjs

      # PR 只做构建检查；只有 main 分支才部署到 Cloudflare
      - name: Deploy to Cloudflare Workers
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
